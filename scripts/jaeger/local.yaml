service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    traces:
      sampler:
        always_off:
      processors: []
    metrics:
      level: none

extensions:
  jaeger_storage:
    backends:
      local:
        badger:
          ephemeral: false
          directories:
            keys: ./data
            values: ./data
          ttl:
            spans: 168h
  jaeger_query:
    storage:
      traces: local
    http:
      endpoint: 127.0.0.1:16686
    grpc:
      endpoint: 127.0.0.1:16685
    ui:
      config_file: ../../scripts/jaeger/ui.json

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

processors:
  batch:
    timeout: 1s

exporters:
  jaeger_storage_exporter:
    trace_storage: local
