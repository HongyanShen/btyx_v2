<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>按请求 ID 查询 · Jaeger</title>
<style>
  :root {font-family: Inter, "Microsoft YaHei", sans-serif; color: #18232e; background: #f5f7f9}
  main {max-width: 38rem; margin: 15vh auto; padding: 2rem; background: white; border: 1px solid #dbe2e8; border-radius: .6rem}
  h1 {font-size: 1.55rem; margin: 0 0 1.5rem}
  label {display:block; font-weight: 600; margin-bottom: .5rem}
  input, button {font: inherit; padding: .7rem; border: 1px solid #8796a2; border-radius: .3rem}
  input {min-width:0; flex:1; font-family: monospace}
  button {color:white; background:#005679; border-color:#005679; cursor:pointer}
  form div {display:flex; gap:.5rem; flex-wrap:wrap}
  p {color:#963d13} p:empty {display:none}
  a {display:inline-block; color:#005679; margin-top:1.25rem}
</style>
<main>
  <h1>查询请求链路</h1>
  <form method="get" action="/">
    <label for="id">X-Request-ID</label>
    <div><input id="id" name="id" value="<!--id-->" autofocus required autocomplete="off" spellcheck="false"><button>查看链路</button></div>
  </form>
  <p role="status"><!--message--></p>
  <a href="http://127.0.0.1:16686/">浏览 Jaeger</a>
</main>
</html>
